<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Stránka nenalezena | Mgr. Markéta Protivová, advokátka</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #1a1f36;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { text-align: center; max-width: 560px; }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 6rem;
      font-weight: 700;
      color: #d4a574;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h2 { font-size: 1.5rem; font-weight: 500; margin-bottom: 1rem; }
    p { margin-bottom: 2rem; opacity: 0.85; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: #d4a574;
      color: #1a1f36;
      padding: 12px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .btn:hover, .btn:focus-visible { background: #c29363; }
    .contact { margin-top: 2rem; font-size: 0.95rem; opacity: 0.75; }
    .contact a { color: #ffffff; }
    @media (max-width: 768px) { h1 { font-size: 4rem; } h2 { font-size: 1.25rem; } }
  </style>
</head>
<body>
  <main class="container">
    <h1>404</h1>
    <h2>Stránka nenalezena</h2>
    <p>Požadovaná stránka neexistuje. Veškeré informace najdete na hlavní stránce.</p>
    <a href="/" class="btn">Zpět na hlavní stránku</a>
    <p class="contact">Telefon <a href="tel:+420602662167">+420 602 662 167</a> · <a href="mailto:protivova@volny.cz">protivova@volny.cz</a></p>
  </main>
</body>
</html>
